<!doctype html>
<!-- The page of tests/web/guests.sub, with files its guests may and may not read. -->
<meta charset="utf-8">
<title>guests</title>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { guests } from './host/web/guest.mjs';
const utf8 = new TextEncoder();
window.app = await boot({
  program: 'program/',
  files: new Map([['/data/note.txt', utf8.encode('a note, read')], ['/secret/key.txt', utf8.encode('not for guests')]]),
  packs: [['guest.pack', '/guest']],
  modules: { dom: dom(document.getElementById('root')), guest: guests() },
});
// The browser tests wait for this flag.
window.ready = true;
</script>
