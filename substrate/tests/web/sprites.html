<!doctype html>
<!-- Lifecycle: experimental.

     The page of tests/web/sprites.sub and sprites-canvas.sub, the
     game that draws many sprites. It takes the number of sprites from
     its address, ?n=NUMBER, and ?offscreen=1 makes the GPU draw without
     showing anything (host/web/gpu.mjs). It times the program's frames
     and shows the numbers at the top of the page, and keeps them in
     window.stats for tests/web/sprites.mjs. The gpu module is in
     window.gpuModule, where the browser tests can read the picture. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sprites</title>
<style>
  html, body { margin: 0; background: #10141a; color: #eee; font: 14px monospace; }
  #numbers { padding: 6px 8px; white-space: pre; }
  #root { width: 640px; }
</style>
<div id="numbers">starting</div>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { audio } from './host/web/audio.mjs';
import { gpu } from './host/web/gpu.mjs';

const query = new URLSearchParams(location.search);
const n = query.get('n') || '1000';
const theDom = dom(document.getElementById('root'));
window.gpuModule = await gpu({ dom: theDom, offscreen: query.get('offscreen') === '1' });
window.adapter = `${window.gpuModule.adapter.vendor || '?'} ${window.gpuModule.adapter.architecture || ''}`.trim();

// What is measured, since the last reset:
//   frames      how many frames the program handled
//   program     the time spent in the program for them, in ms, which
//               includes the host's drawing (below)
//   host        the time the host spent applying the program's patches
//               and GPU commands, which is the drawing
//   intervals   the time between the browser's frames
const stats = { frames: 0, program: 0, host: 0, intervals: [] };
const timed = (inner) => (caller, app) => {
  const imports = inner(caller, app);
  const apply = imports.apply;
  imports.apply = (p, l) => {
    const t = performance.now();
    apply(p, l);
    stats.host += performance.now() - t;
  };
  return imports;
};
window.app = await boot({
  program: 'program/', args: [n], lists: [['assets.list', '/']],
  modules: { dom: timed(theDom), audio: audio(), gpu: timed(window.gpuModule) },
});
const call = window.app.call;
window.app.call = (name, ...args) => {
  const t = performance.now();
  const r = call(name, ...args);
  if (name === 'on-event') {
    stats.program += performance.now() - t;
    stats.frames++;
  }
  return r;
};
let last = 0;
const tick = (t) => {
  if (last) stats.intervals.push(t - last);
  last = t;
  requestAnimationFrame(tick);
};
requestAnimationFrame(tick);
window.reset = () => {
  stats.frames = 0; stats.program = 0; stats.host = 0; stats.intervals = [];
  shown = { frames: 0, program: 0, host: 0, intervals: 0 };
  window.gpuModule.timing.frames = 0;
  window.gpuModule.timing.ms = 0;
};
// The GPU's own time per frame, as the module measures it: from
// handing the frame over until the GPU was done with it.
window.stats = () => JSON.stringify({ ...stats, gpu: window.gpuModule.timing });

// The numbers at the top of the page, once a second, for the second
// that passed. (The totals are left alone: sprites.mjs reads them.)
let shown = { frames: 0, program: 0, host: 0, intervals: 0 };
setInterval(() => {
  const frames = stats.frames - shown.frames;
  if (frames === 0) return;
  const recent = stats.intervals.slice(shown.intervals);
  const mean = recent.reduce((a, b) => a + b, 0) / Math.max(1, recent.length);
  document.getElementById('numbers').textContent =
    `${n} sprites, ${((stats.program - shown.program) / frames).toFixed(2)} ms per frame in the program, ` +
    `of which ${((stats.host - shown.host) / frames).toFixed(2)} ms drawing; ${(1000 / mean).toFixed(1)} frames a second`;
  shown = { frames: stats.frames, program: stats.program, host: stats.host, intervals: stats.intervals.length };
}, 1000);
window.ready = true;
</script>
</html>
