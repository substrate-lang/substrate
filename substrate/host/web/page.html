<!doctype html>
<!-- Lifecycle: experimental. A page for a program whose views are ui.sub's
     (next/web): the program is the directory program/, and its nodes go
     in #root. next/web/site.sh puts this, the host and a program together
     as a site, which any server of files serves. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>substrate</title>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
window.app = await boot({ program: 'program/', modules: { dom: dom(document.getElementById('root')) } });
window.ready = true;
</script>
