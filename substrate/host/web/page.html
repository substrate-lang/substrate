<!doctype html>
<!-- Lifecycle: experimental.

     The default web page for a program whose user interface is written
     with next/web/ui.sub. next/web/site.sh copies it into a site as
     index.html, next to the program (in program/), its assets (in
     assets/) and the host's JavaScript (in host/).

     The program draws into the element with id "root". It is given
     three host modules: "dom", to draw, "audio", for sound effects, and
     "gpu", for WebGPU (a stand-in in a browser without it). A program
     that needs more, such as the "guest" module, uses a page of its own
     (see next/web/repl/page.html).

     This page downloads all of the program's assets before it starts the
     program, so that the program can read any of them as a file. A site
     with many or large assets should use a page of its own that lists
     only the files the program reads. An image, or anything else that
     the browser loads by its URL ("assets/NAME"), does not need to be
     listed. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>substrate</title>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { audio } from './host/web/audio.mjs';
import { gpu } from './host/web/gpu.mjs';
const theDom = dom(document.getElementById('root'));
window.app = await boot({
  program: 'program/',
  // assets.list names the program's assets, as "assets/NAME". They become
  // the program's files, under the same names.
  lists: [['assets.list', '/']],
  modules: { dom: theDom, audio: audio(), gpu: await gpu({ dom: theDom }) },
});
// The browser tests wait for this flag.
window.ready = true;
</script>
