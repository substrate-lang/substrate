<!doctype html>
<!-- Lifecycle: experimental.

     The default web page for a program whose user interface is written
     with next/web/ui.sub. next/web/site.sh copies it into a site as
     index.html, next to the program (in program/) and the host's
     JavaScript (in host/).

     The program draws into the element with id "root". It is given one
     host module, "dom". A program that needs more, such as file packs or
     the "guest" module, uses its own page (see next/web/repl/page.html). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>substrate</title>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
window.app = await boot({ program: 'program/', modules: { dom: dom(document.getElementById('root')) } });
// The browser tests wait for this flag.
window.ready = true;
</script>
