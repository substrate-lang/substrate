<!doctype html>
<!-- Lifecycle: experimental.

     The web page of the platformer example. It is the default page
     (host/web/page.html) with a dark background and no margins, so that
     the game fills the window. lib/web/site.sh copies it into the site
     as index.html.

     The game draws on a single canvas, which the game loop stretches to
     fill the window (lib/web/game/game.sub). Its assets, the levels
     and the sprite sheet, are downloaded with the list assets.list, as
     in the default page. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>platformer</title>
<style>
  html, body { height: 100%; margin: 0; background: #10141a; overflow: hidden; }
  #root { height: 100%; display: flex; align-items: center; }
</style>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { audio } from './host/web/audio.mjs';

// Kept where the browser tests can ask how many sounds were played.
window.audio = audio();
window.app = await boot({
  program: 'program/',
  lists: [['assets.list', '/']],
  modules: { dom: dom(document.getElementById('root')), audio: window.audio },
});
// The browser tests wait for this flag.
window.ready = true;
</script>
</html>
