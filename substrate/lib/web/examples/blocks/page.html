<!doctype html>
<!-- Lifecycle: experimental.

     The web page of the blocks example: the platformer's page
     (../platformer/page.html) with its own title. The game draws on a
     canvas with the GPU, so the page gives the program the "gpu"
     module, and keeps it where the browser tests can read the picture;
     ?offscreen=1 in the address makes the GPU draw without showing
     anything, which is how it is measured on a GPU in the headless
     browser (host/web/gpu.mjs). The texture atlas is downloaded with
     the list assets.list, as in the default page. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blocks</title>
<style>
  html, body { height: 100%; margin: 0; background: #10141a; overflow: hidden; }
  #root { height: 100%; display: flex; align-items: center; }
</style>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { audio } from './host/web/audio.mjs';
import { gpu } from './host/web/gpu.mjs';

const theDom = dom(document.getElementById('root'));
window.gpuModule = await gpu({ dom: theDom, offscreen: new URLSearchParams(location.search).get('offscreen') === '1' });
window.app = await boot({
  program: 'program/',
  lists: [['assets.list', '/']],
  modules: { dom: theDom, audio: audio(), gpu: window.gpuModule },
});
// The browser tests wait for this flag.
window.ready = true;
</script>
</html>
