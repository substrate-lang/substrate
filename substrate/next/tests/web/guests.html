<!doctype html>
<!-- Lifecycle: experimental.

     The page for the guests test (next/tests/web/guests.sub).
     next/tests/web/run.sh copies it into the test site as index.html.

     The page's program is in program/. Its files, kept in memory, are:
       /guest/...        the program that the guests run (a-guest.sub),
                         loaded from guest.pack
       /data/note.txt    a file the test lets its guests read
       /secret/key.txt   a file the test does not let them read -->
<meta charset="utf-8">
<title>guests</title>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { guests } from './host/web/guest.mjs';
const utf8 = new TextEncoder();
window.app = await boot({
  program: 'program/',
  files: new Map([['/data/note.txt', utf8.encode('a note, read')], ['/secret/key.txt', utf8.encode('not for guests')]]),
  packs: [['guest.pack', '/guest']],
  modules: { dom: dom(document.getElementById('root')), guest: guests() },
});
// The browser tests wait for this flag.
window.ready = true;
</script>
