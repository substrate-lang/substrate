<!doctype html>
<!-- Lifecycle: experimental.

     A test page that runs the compiler inside the browser.
     next/tests/web/run.sh builds its site and session.mjs drives it.

     The page's program is the compiler itself. The URL names a session
     test: index.html?session=NAME. The compiler is started with the same
     arguments as `next/sub eval NAME.sub` on the command line, so it
     evaluates the forms of next/tests/session/NAME.sub one at a time.
     Whatever it prints is shown in the element with id "out", where
     session.mjs reads it.

     The compiler's files are kept in memory: the library sources and the
     tests come from files.pack (placed under /src), and the compiler's
     own build is placed under /program. -->
<meta charset="utf-8">
<title>session</title>
<pre id="out"></pre>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
const out = document.getElementById('out');
const name = new URLSearchParams(location.search).get('session');
const started = performance.now();
try {
  await boot({
    program: 'program/',
    programAt: '/program',
    packs: [['files.pack', '/src']],
    cwd: '/src/next/tests/session',
    args: ['/src', 'eval', `${name}.sub`, '-p', '/src', '-d', '/src/next/tests/session', '-r', '/program', '-c', '/cache'],
    write: (fd, text) => { out.textContent += text; },
  });
} catch (e) {
  out.textContent += `\nhost: ${e.stack || e}\n`;
}
window.elapsed = performance.now() - started;
window.done = true;
</script>
