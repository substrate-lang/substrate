<!doctype html>
<!-- Lifecycle: experimental. The compiler in a page (next/tests/web/run.sh):
     it evaluates the session test the page's query names, session=NAME
     (next/tests/session), as next/sub eval does, its files a pack's, and
     what it writes is the text of #out. -->
<meta charset="utf-8">
<title>session</title>
<pre id="out"></pre>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
const out = document.getElementById('out');
const name = new URLSearchParams(location.search).get('session');
const started = performance.now();
try {
  await boot({
    program: 'program/',
    programAt: '/program',
    packs: [['files.pack', '/src']],
    cwd: '/src/next/tests/session',
    args: ['/src', 'eval', `${name}.sub`, '-p', '/src', '-d', '/src/next/tests/session', '-r', '/program', '-c', '/cache'],
    write: (fd, text) => { out.textContent += text; },
  });
} catch (e) {
  out.textContent += `\nhost: ${e.stack || e}\n`;
}
window.elapsed = performance.now() - started;
window.done = true;
</script>
