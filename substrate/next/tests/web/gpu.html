<!doctype html>
<!-- Lifecycle: experimental.

     The page of next/tests/web/gpu.sub, a test of the host module "gpu".
     It gives the program the dom, audio and gpu modules, and keeps the
     gpu module in window.gpuModule for the test. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gpu</title>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { audio } from './host/web/audio.mjs';
import { gpu } from './host/web/gpu.mjs';
const theDom = dom(document.getElementById('root'));
window.gpuModule = await gpu({ dom: theDom });
window.app = await boot({
  program: 'program/',
  lists: [['assets.list', '/']],
  modules: { dom: theDom, audio: audio(), gpu: window.gpuModule },
});
// The browser tests wait for this flag.
window.ready = true;
</script>
