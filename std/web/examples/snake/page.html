<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snake</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: #0b0e13; color: #d7dde5; font: 15px/1.5 system-ui, sans-serif;
         display: flex; justify-content: center; }
  .snake { padding: 1.5rem 1rem; width: 400px; max-width: 100%; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.75rem; }
  h1 { font: 600 1.1rem/1.2 ui-monospace, Menlo, Consolas, monospace; margin: 0; letter-spacing: 0.04em; }
  header p { margin: 0; color: #8b96a5; white-space: pre; }
  header span { color: #d7dde5; font-variant-numeric: tabular-nums; }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; outline: 1px solid #1f2733; }
  #status { color: #8b96a5; margin: 0.75rem 0; min-height: 1.5em; }
  button { font: inherit; color: #d7dde5; background: transparent; border: 1px solid #2b3545;
           border-radius: 4px; padding: 0.25rem 0.8rem; cursor: pointer; }
  button:hover { border-color: #57ab5a; color: #b4f1a7; }
</style>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { storage } from './host/web/storage.mjs';
window.app = await boot({ program: 'program/', modules: { dom: dom(document.getElementById('root')), storage: storage('snake') } });
// The browser tests wait for this flag.
window.ready = true;
</script>
</html>
