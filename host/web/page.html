<!doctype html>
<!-- The default page for a program that uses lib/web/ui.sub. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>substrate</title>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { audio } from './host/web/audio.mjs';
import { gpu } from './host/web/gpu.mjs';
import { clock } from './host/modules/clock.mjs';
import { random } from './host/modules/random.mjs';
import { timer } from './host/modules/timer.mjs';
import { fetchModule } from './host/modules/fetch.mjs';
import { websocket } from './host/modules/websocket.mjs';
import { storage } from './host/web/storage.mjs';
import { locationModule } from './host/web/location.mjs';
import { clipboard } from './host/web/clipboard.mjs';
import { files } from './host/web/files.mjs';
import { workers } from './host/web/worker.mjs';
const theDom = dom(document.getElementById('root'));
window.app = await boot({
  program: 'program/',
  lists: [['assets.list', '/']],
  modules: {
    dom: theDom, audio: audio(), gpu: await gpu({ dom: theDom }),
    clock: clock(), random: random(), timer: timer(), fetch: fetchModule(), websocket: websocket(), worker: workers(),
    storage: storage(location.pathname.replace(/[^/]*$/, '')), location: locationModule(), clipboard: clipboard(), files: files(),
  },
});
// The browser tests wait for this flag.
window.ready = true;
</script>
