<!doctype html>
<!-- The page of tests/web/workers.sub, with files its workers may and may not read. -->
<meta charset="utf-8">
<title>workers</title>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { workers } from './host/web/worker.mjs';
const utf8 = new TextEncoder();
window.app = await boot({
  program: 'program/',
  files: new Map([['/data/note.txt', utf8.encode('a note, read')], ['/secret/key.txt', utf8.encode('not for workers')]]),
  packs: [['worker.pack', '/worker']],
  modules: { dom: dom(document.getElementById('root')), worker: workers() },
});
// The browser tests wait for this flag.
window.ready = true;
</script>
