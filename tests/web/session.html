<!doctype html>
<!-- Runs the compiler in the page on a session test, as bin/sub eval does: ?session=NAME, with the files site.json gives. -->
<meta charset="utf-8">
<title>session</title>
<pre id="out"></pre>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
const out = document.getElementById('out');
const name = new URLSearchParams(location.search).get('session');
const started = performance.now();
try {
  const settings = await (await fetch('site.json')).json();
  await boot({
    program: 'program/',
    packs: settings.packs,
    cwd: '/src/tests/session',
    args: ['/src/substrate', 'eval', `${name}.sub`, '-d', '/src/tests/session', '-c', '/cache',
           '-m', '/src/tests/web/session.map'],
    write: (fd, text) => { out.textContent += text; },
  });
} catch (e) {
  out.textContent += `\nhost: ${e.stack || e}\n`;
}
window.elapsed = performance.now() - started;
window.done = true;
</script>
