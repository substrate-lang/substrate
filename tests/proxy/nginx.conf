# nginx in front of the server, for run.mjs, which fills in the ports and the files. proxy_read_timeout is cut to 3 s
# from its 60 s so that the test sees WebSocket pings keep a connection open past it.
daemon off;
pid PIDFILE;
error_log stderr;
events {}
http {
	access_log off;
	client_body_temp_path TEMP/body;
	proxy_temp_path TEMP/proxy;
	fastcgi_temp_path TEMP/fastcgi;
	uwsgi_temp_path TEMP/uwsgi;
	scgi_temp_path TEMP/scgi;
	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' '';
	}
	server {
		listen 127.0.0.1:PROXY_PORT ssl;
		ssl_certificate CERT;
		ssl_certificate_key KEY;
		location / {
			proxy_pass http://127.0.0.1:SERVER_PORT;
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 3s;
		}
	}
}
