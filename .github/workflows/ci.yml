name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c make check
      - run: nix develop -c make npm
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: build/substrate-lang-*.tgz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c make check
      - run: nix develop -c make npm

  windows:
    runs-on: windows-latest
    env:
      MSYS: winsymlinks:nativestrict
      JSON_TEST_SUITE: ${{ github.workspace }}/build/json-test-suite
      SUBSTRATE_CHROMIUM: C:\Program Files\Google\Chrome\Application\chrome.exe
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.symlinks true
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nst/JSONTestSuite
          ref: 1ef36fa01286573e846ac449e8683f8833c5b26a
          path: build/json-test-suite
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bin/substrate version
      - run: tests/run.sh

  windows-npm:
    needs: linux
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: build
      - run: npm/smoke.sh
      - run: npm install --global --no-audit --no-fund ./build/substrate-lang-*.tgz
      - run: substrate version
        shell: pwsh
      - run: substrate version
        shell: cmd
